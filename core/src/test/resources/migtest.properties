# Boot 4 migration, decision 6: the one database the startup tests may touch, a throwaway on the local SQL Server, created
# and dropped by the tests (core.support.MigTestDatabase). Another database name or a server that is not this machine is
# refused: the test fails, it never connects there. Never Store A, never a customer database, never an existing database.
migtest.server=localhost
migtest.port=1433
migtest.database=zsretail_migtest
migtest.username=sa
migtest.options=encrypt=true;trustServerCertificate=true;loginTimeout=5

# No password in this file: read at run time from this machine file of configs/ (spring.datasource.password), never copied
migtest.password-file=dev/headoffice.properties
