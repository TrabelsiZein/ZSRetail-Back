# Common to every installation. Only two types exist, each with its file: application-store.properties and
# application-headoffice.properties (what the installation is). Where it runs (database, port, folders, links) is in
# the installation's own file, outside the WAR: -Dzsretail.machine-file=<path> in Eclipse, or
# <Tomcat>/conf/zsretail/zsretailws.properties on a server. Code cleanup step 6.5: the application is the type (the store
# WAR runs a store, the head office WAR a head office), so no file names it; an old outside file that names it keeps
# working when it names the application's type. See configs/README.txt and docs/deployment-modes.md.

server.servlet.context-path=/zsretail/api
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Database: SQL Server on every installation (the type file or the outside file gives the address and the login)
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServer2012Dialect
spring.jpa.hibernate.ddl-auto=update

# Application version — injected from pom.xml at build time via Maven resource filtering
app.version=@project.version@

# 3.3.0, the communication module (docs/modules/communication.md), a store and a head office alike: off unless the
# installation's own file says true. Absent or empty is off too; another value than true or false: off, one WARN line
# (step 8e: no messaging line ever stops a back end).
communication.enabled=false
# With it on (it is the master: off, the lines below do nothing): the seconds between two cycles (absent or empty: 60;
# not a whole number of at least 1: 60 and a WARN); each channel true / false (absent or empty: false); its provider,
# no default (step 8e): smtp for email, http for SMS, meta for WhatsApp, or test (nothing leaves, the message is still
# recorded as sent: a WARN at the start and a notice on the page); a channel on with no provider line or an unknown
# name stays off with a WARN; the country code put before a member's 8 digits (absent or empty: 216; not 1 to 3
# digits: 216 and a WARN). Step 8b: while messages wait on a channel not paused, the next cycle comes after 5 s. In
# every value below, a placeholder is written {phone}, never ${phone}: Spring reads ${...} as one of its own and stops
# the start. Set these lines at the installation that sends: a store whose loyalty is the head office's only needs
# communication.enabled=true; the other lines written there are not read (one WARN names them).
communication.cycle-seconds=60
communication.whatsapp.enabled=false
communication.whatsapp.provider=
communication.sms.enabled=false
communication.sms.provider=
communication.email.enabled=false
communication.email.provider=
communication.phone-country-code=216
# Step 8a, email through an SMTP server (communication.email.provider=smtp): the host (empty: the email channel stays
# off, one WARN line, never a refused start), the port, the security none / starttls / ssl, the login (empty: none), the
# password (empty here: set it only in the installation's own file), the timeout of the connection, of each read and of
# each write in seconds (1 to 300; step 8c: the answer after an email's final "." waits at least 60 s, servers check the
# email before answering), the sender's address (empty: the channel stays off) and name.
communication.email.smtp.host=
communication.email.smtp.port=587
communication.email.smtp.security=starttls
communication.email.smtp.username=
communication.email.smtp.password=
communication.email.smtp.timeout-seconds=15
communication.email.from-address=
communication.email.from-name=
# Step 8b, SMS through an HTTP gateway (communication.sms.provider=http), plugged in by filling lines, no code: one call
# per SMS. The address (http or https; empty: the SMS channel stays off, one WARN line, never a refused start), GET or
# POST, how the fields travel (query: in the address; form; json), a JSON template (json only; empty: one object of the
# fields), the key, the login and the password (empty here: set them only in the installation's own file), the sender
# name, the phone's format (with-plus +21620123456, without-plus 21620123456, with-00 0021620123456, local 20123456),
# what {unicode} becomes (the value when the text needs Unicode, Arabic, then otherwise), the connect and read timeouts
# in seconds (1 to 300). How to read the answer: the HTTP statuses that mean accepted (a list or ranges), optionally a
# JSON field and its accepted values (comma list), or a text the answer must hold; where the gateway's id is (a JSON
# field, or a regular expression with one group: in this file a backslash is written twice); where its error text is (a
# JSON field; empty: the answer's start); texts that, in a refusal, mean the channel cannot send at all (comma list, e.g.
# credit,balance: the channel pauses instead of failing each SMS). One line per field and per header, no default:
# communication.sms.http.field.<name>=<value> and communication.sms.http.header.<Name>=<value>. Placeholders in the
# address, the fields, the headers and the template: {phone} {text} {sender} {messageId} {unicode} {key} {username}
# {password} {basic} (Base64 of username:password). An unknown placeholder turns the channel off with a WARN line.
communication.sms.http.url=
communication.sms.http.method=GET
communication.sms.http.body=query
communication.sms.http.json-template=
communication.sms.http.key=
communication.sms.http.username=
communication.sms.http.password=
communication.sms.http.sender=
communication.sms.http.phone-format=with-plus
communication.sms.http.unicode-values=true,false
communication.sms.http.connect-timeout-seconds=10
communication.sms.http.read-timeout-seconds=30
communication.sms.http.accepted-status=200-299
communication.sms.http.accepted-field=
communication.sms.http.accepted-value=
communication.sms.http.accepted-text=
communication.sms.http.id-field=
communication.sms.http.id-regex=
communication.sms.http.error-field=
communication.sms.http.channel-error-texts=
# Step 8c: true only for a gateway that refuses doubles on {messageId}: an SMS with no answer is then tried again after
# the channel's pause (with the same {messageId}) instead of FAILED "no answer from the provider".
communication.sms.http.retry-no-answer=false
# Example 1, a GET gateway with the key in the address and a text answer "OK <id>" or "ERR <words>" (copy the lines into
# the installation's own file without the leading #, and put the real key there):
#communication.sms.enabled=true
#communication.sms.provider=http
#communication.sms.http.url=https://sms.example.tn/api/send?key={key}
#communication.sms.http.method=GET
#communication.sms.http.field.to={phone}
#communication.sms.http.field.from={sender}
#communication.sms.http.field.text={text}
#communication.sms.http.field.unicode={unicode}
#communication.sms.http.field.ref={messageId}
#communication.sms.http.unicode-values=1,0
#communication.sms.http.phone-format=without-plus
#communication.sms.http.sender=MAGASIN
#communication.sms.http.key=CHANGE_ME
#communication.sms.http.accepted-text=OK
#communication.sms.http.id-regex=OK\\s+(\\S+)
# Example 2, a JSON POST gateway with the key in a header and a JSON answer {"status":"OK","messageId":"..."} or
# {"status":"ERROR","error":"..."}:
#communication.sms.enabled=true
#communication.sms.provider=http
#communication.sms.http.url=https://api.example.com/v1/sms
#communication.sms.http.method=POST
#communication.sms.http.body=json
#communication.sms.http.json-template={"to":"{phone}","from":"{sender}","text":"{text}","unicode":{unicode},"clientRef":"{messageId}"}
#communication.sms.http.header.Authorization=Bearer {key}
#communication.sms.http.sender=MAGASIN
#communication.sms.http.key=CHANGE_ME
#communication.sms.http.accepted-field=status
#communication.sms.http.accepted-value=OK
#communication.sms.http.id-field=messageId
#communication.sms.http.error-field=error
#communication.sms.http.channel-error-texts=credit,balance
# Step 8a, the test-recipient mode, before any real provider: a phone (8 digits, or + and 8 to 15 digits) and an email.
# Filled, every message of that kind goes to it instead of the member's (the message keeps the member's address and says
# it was redirected); not an address: that kind's channels stay off. Empty: the members' addresses.
communication.test-recipient.phone=
communication.test-recipient.email=

# Step 8c, WhatsApp through Meta's WhatsApp Cloud API (communication.whatsapp.provider=meta): always a template message,
# by the template's name at Meta (Templates tab), its language and the values of its {fields} in order. The address
# (Meta's by default; a reseller offering the same API: its own), the API version (v26.0, the newest on Meta's versions
# page developers.facebook.com/docs/graph-api/changelog/versions on 2026-11-21), the sender's phone number id (empty:
# the WhatsApp channel stays off, one WARN line, never a refused start), the access token (empty here: set it only in
# the installation's own file; empty: the channel stays off), the header carrying it and its prefix (an empty prefix
# sends the token alone), the connect and read timeouts in seconds (1 to 300). Meta's error codes sorted in four
# families (the channel's problem: the pause; this message tried later; this message FAILED; the template's problem:
# its campaign stopped): codes or ranges added to a family here win over the built-in ones (e.g.
# communication.whatsapp.meta.retry-codes=131056).
communication.whatsapp.meta.url=https://graph.facebook.com
communication.whatsapp.meta.api-version=v26.0
communication.whatsapp.meta.phone-number-id=
communication.whatsapp.meta.token=
communication.whatsapp.meta.token-header=Authorization
communication.whatsapp.meta.token-prefix=Bearer
communication.whatsapp.meta.connect-timeout-seconds=10
communication.whatsapp.meta.read-timeout-seconds=30
communication.whatsapp.meta.channel-codes=
communication.whatsapp.meta.retry-codes=
communication.whatsapp.meta.message-codes=
communication.whatsapp.meta.template-codes=

# Rolling file log: one file per day (gzipped archives), 200MB size splits (in practice: one file per day),
# auto-deleted after 90 days. Console output continues in parallel (procrun). The file itself: logging.file.name in
# the type file or the outside file.
logging.file.max-size=200MB
logging.file.max-history=90
logging.file.total-size-cap=3GB
logging.file.clean-history-on-start=true
