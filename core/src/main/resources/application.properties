# Common to every installation. Only two types exist, each with its file: application-store.properties and
# application-headoffice.properties (what the installation is). Where it runs (database, port, folders, links) is in
# the installation's own file, outside the WAR: -Dzsretail.machine-file=<path> in Eclipse, or
# <Tomcat>/conf/zsretail/zsretailws.properties on a server. Code cleanup step 6.5: the application is the type (the store
# WAR runs a store, the head office WAR a head office), so no file names it; an old outside file that names it keeps
# working when it names the application's type. See configs/README.txt and docs/deployment-modes.md.

server.servlet.context-path=/zsretail/api
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Database: SQL Server on every installation (the type file or the outside file gives the address and the login)
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServer2012Dialect
spring.jpa.hibernate.ddl-auto=update

# Application version — injected from pom.xml at build time via Maven resource filtering
app.version=@project.version@

# 3.3.0, the communication module (docs/modules/communication.md), a store and a head office alike: off unless the
# installation's own file says true. Absent or empty is off too; another value than true or false stops the start.
communication.enabled=false
# With it on (it is the master: off, the lines below do nothing): the seconds between two cycles (absent or empty: 60);
# each channel true / false (absent or empty: false, never blocks the start); its provider (absent or empty: test, the
# only one so far: it sends nothing; an unknown name stops the start); the country code put before a member's 8 digits
# (absent or empty: 216).
communication.cycle-seconds=60
communication.whatsapp.enabled=false
communication.whatsapp.provider=test
communication.sms.enabled=false
communication.sms.provider=test
communication.email.enabled=false
communication.email.provider=test
communication.phone-country-code=216
# Step 8a, email through an SMTP server (communication.email.provider=smtp): the host (empty: the email channel stays
# off, one WARN line, never a refused start), the port, the security none / starttls / ssl, the login (empty: none), the
# password (empty here: set it only in the installation's own file), the timeout of the connection, of each read and of
# each write in seconds (1 to 300), the sender's address (empty: the channel stays off) and name.
communication.email.smtp.host=
communication.email.smtp.port=587
communication.email.smtp.security=starttls
communication.email.smtp.username=
communication.email.smtp.password=
communication.email.smtp.timeout-seconds=15
communication.email.from-address=
communication.email.from-name=
# Step 8a, the test-recipient mode, before any real provider: a phone (8 digits, or + and 8 to 15 digits) and an email.
# Filled, every message of that kind goes to it instead of the member's (the message keeps the member's address and says
# it was redirected); not an address: that kind's channels stay off. Empty: the members' addresses.
communication.test-recipient.phone=
communication.test-recipient.email=

# Rolling file log: one file per day (gzipped archives), 200MB size splits (in practice: one file per day),
# auto-deleted after 90 days. Console output continues in parallel (procrun). The file itself: logging.file.name in
# the type file or the outside file.
logging.file.max-size=200MB
logging.file.max-history=90
logging.file.total-size-cap=3GB
logging.file.clean-history-on-start=true
