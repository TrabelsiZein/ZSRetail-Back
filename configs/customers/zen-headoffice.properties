# ZEN, the head office (franchise network, item variants): the outside file of its head office, configured exactly as the
# Happyness head office (customers/happyness-headoffice.properties) with the ERP connector zen. The shape of the real
# installation: the catalogue only from the ERP (ZEN's NAV, its custom API api/sat/zsretail/v1.0, connector zen; one item
# per variant), customers and supply kept here, no stock at the head office. The values below are placeholders: at an
# installation copy it to <Tomcat>/conf/zsretail/zsretailws.properties and fill every CHANGE_ME and the real addresses.
# Never commit a real password. Its stores: customers/zen-store.properties.
# See docs/deployment-modes.md and docs/deploy-note.md.

# ---------------------------------------------------------------------------------------------------------------------
# Where it runs
# ---------------------------------------------------------------------------------------------------------------------
spring.datasource.url=jdbc:sqlserver://localhost;databaseName=zen_headoffice
spring.datasource.username=sa
spring.datasource.password=CHANGE_ME
server.port=888
logging.file.name=C:/zsretail-headoffice/logs/backend.log
app.upload.dir=uploads/headoffice/pos-images
# Selling prices from the ERP's price groups (sales_price table): true | false
pos.pricing.enable-sales-price-group=false

# ---------------------------------------------------------------------------------------------------------------------
# What this installation is
# ---------------------------------------------------------------------------------------------------------------------
# No stock and no purchases at the head office
headoffice.stock.enabled=false
# The catalogue only from the ERP (customers and supply kept here)
ownership.catalogue=ERP
# The stores' supply documents: the head office's BLs and invoices until step 9 of the item variants (the connector zen
# does not read the ERP's invoices yet). At step 9: ERP, as the Happyness head office (the ERP's invoices to the stores).
headoffice.supply.source=HEAD_OFFICE

# ---------------------------------------------------------------------------------------------------------------------
# The ERP connector zen (ZEN's NAV, its custom API; GET only, it never writes to the ERP)
# ---------------------------------------------------------------------------------------------------------------------
erp.connector=zen
erp.sync.enabled=true
# The NAV instance (the API path api/sat/zsretail/v1.0 and the company follow it)
erp.zen.base-url=http://CHANGE_ME:7048/ZEN
# The company's name; its id in the API is looked up once by this name (or set erp.zen.company-id to skip the lookup)
erp.zen.company=CHANGE_ME
erp.zen.domain=CHANGE_ME
erp.zen.username=CHANGE_ME
erp.zen.password=CHANGE_ME
# The VAT of a row of the API that gives none (the API has no VAT field yet)
erp.zen.default-vat=19
