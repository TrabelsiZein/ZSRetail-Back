# Happyness, the head office (franchise network): the outside file of its head office, in the 2.3 form. The shape of the
# real installation: the catalogue only from the ERP (Business Central, its POS pages, connector happyness), customers
# and supply kept here, the stores' supply documents are the ERP's invoices, no stock at the head office. The values are
# those of the test BC of the dev PC (was configs/local/happyness_ho.properties until 2026-10-11); at an installation
# copy it to <Tomcat>/conf/zsretail/zsretailws.properties and fill the CHANGE_ME and the real addresses. Never commit a
# real password. Its stores: a store of the network (configs/happyness-from-scratch/store-1.properties).
# See docs/deployment-modes.md and docs/deploy-note.md.

# ---------------------------------------------------------------------------------------------------------------------
# Where it runs
# ---------------------------------------------------------------------------------------------------------------------
spring.datasource.url=jdbc:sqlserver://localhost;databaseName=happyness_franchise
spring.datasource.username=sa
spring.datasource.password=CHANGE_ME
server.port=888
logging.file.name=C:/zsretail-headoffice/logs/backend.log
app.upload.dir=uploads/headoffice/pos-images
# Selling prices from the ERP's price groups (sales_price table): true | false
pos.pricing.enable-sales-price-group=false

# ---------------------------------------------------------------------------------------------------------------------
# What this installation is
# ---------------------------------------------------------------------------------------------------------------------
# No stock and no purchases at the head office
headoffice.stock.enabled=false
# The catalogue only from the ERP (customers and supply kept here)
ownership.catalogue=ERP
# Invoices from the ERP: the stores' supply documents are the ERP's invoices (FactureFranchise), not the head office's
# BLs and invoices (HEAD_OFFICE | ERP; ERP needs the catalogue only from the ERP and the connector happyness)
headoffice.supply.source=ERP

# ---------------------------------------------------------------------------------------------------------------------
# The ERP connector happyness (Business Central, its POS pages; GET only, it never writes to the ERP)
# ---------------------------------------------------------------------------------------------------------------------
erp.connector=happyness
erp.sync.enabled=true
erp.happyness.base-url=http://192.168.1.124:7048/BC140/ODataV4
erp.happyness.company=HAPPYNESS
erp.happyness.domain=HappyNess
erp.happyness.username=Administrateur
erp.happyness.password=CHANGE_ME
erp.happyness.default-vat=19
erp.happyness.price-includes-vat=true
# The seller on the stores' purchase invoices. Where the reading of the ERP's invoices starts: the General Setup "Read
# ERP invoices after number" (the invoices go to the store whose ERP customer number is the invoice's Sell_to_Customer_No)
erp.happyness.invoices.seller-name=Happyness
