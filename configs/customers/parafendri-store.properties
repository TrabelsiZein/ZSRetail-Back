# ParaFendri, a store of one of its points de vente: the outside file of a store on the ERP, configured exactly as an
# EMTOP store (customers/erp-prod.properties) with the ERP connector parafendri: ParaFendri's Business Central 28
# on-prem, its custom API api/sat/zsretail/v1.0. One file per point de vente. The values below are placeholders: at an
# installation copy it to <Tomcat>/conf/zsretail/zsretailws.properties and fill every CHANGE_ME and the real addresses.
# Never commit a real password. See docs/deployment-modes.md and docs/modules/erp-sync.md ("ParaFendri's connector").

# --- What this installation is: a store on the ERP ---
# Items, customers and goods come from the ERP; promotions and loyalty stay the store's
ownership.catalogue=ERP
ownership.customers=ERP
ownership.promotions=LOCAL
ownership.loyalty=LOCAL
ownership.supply=ERP
# The sales are sent to the ERP
sales.upstream=ERP

# --- The ERP connector parafendri (step 0: the settings and the connection test only) ---
erp.connector=parafendri
# Step 0 implements no job: every fetch answers nothing and every send fails. The ERP jobs stay off until the steps
# that write them.
erp.sync.enabled=false
# The Business Central instance (the API path api/sat/zsretail/v1.0 and the company follow it)
erp.parafendri.base-url=http://CHANGE_ME:7048/CHANGE_ME
# The company's id in the API (GET <base-url>/api/sat/zsretail/v1.0/companies lists them), a GUID
erp.parafendri.company-id=00000000-0000-0000-0000-000000000000
erp.parafendri.domain=CHANGE_ME
erp.parafendri.username=CHANGE_ME
erp.parafendri.password=CHANGE_ME
# Shown with their default
#erp.parafendri.connect-timeout-seconds=30
#erp.parafendri.read-timeout-seconds=600

# --- Where it runs ---
spring.datasource.url=jdbc:sqlserver://localhost;databaseName=CHANGE_ME;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=CHANGE_ME
server.port=444
logging.file.name=C:/zsretail-parafendri/store/logs/backend.log
app.upload.dir=C:/zsretail-parafendri/store/uploads/pos-images
pos.pricing.enable-sales-price-group=false
