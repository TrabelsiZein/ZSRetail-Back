# ZEN, a store of the franchise network: the outside file of a store, configured exactly as a store of the Happyness
# network (happyness-from-scratch/store-1.properties): no ERP, everything from the head office (customers/zen-headoffice
# .properties), its sales copied up to the head office only. The values below are placeholders: at an installation copy
# it to <Tomcat>/conf/zsretail/zsretailws.properties and fill every CHANGE_ME, the head office address and this store's
# key. Never commit a real password.

# --- What this installation is: a store of a network, without ERP ---
# Items, selling prices and goods (BLs) come from the head office
ownership.catalogue=HEAD_OFFICE
ownership.supply=HEAD_OFFICE
# Promotions and loyalty are managed by the head office
ownership.promotions=HEAD_OFFICE
ownership.loyalty=HEAD_OFFICE
# Customers stay the store's
ownership.customers=LOCAL
# The sales are copied up to the head office (only there: no ERP)
sales.upstream=HEAD_OFFICE
erp.connector=none
erp.sync.enabled=false

# --- Where it runs ---
spring.datasource.url=jdbc:sqlserver://localhost;databaseName=zen_store
spring.datasource.username=sa
spring.datasource.password=CHANGE_ME
server.port=444
logging.file.name=C:/zsretail-zen/store/logs/backend.log
app.upload.dir=C:/zsretail-zen/store/uploads/pos-images
pos.pricing.enable-sales-price-group=false

# --- Head office link: the head office address, and this store's key (shown once on the head office Stores page) ---
headoffice.url=http://CHANGE_ME:888/zsretail/api
headoffice.api-key=CHANGE_ME
