# LOCAL (dev PC) - Head office. NOT a profile: the head office's own file (the "outside file").
# Loaded by the Eclipse debug configuration "Head office" through its VM argument:
#   -Dzsretail.machine-file="${project_loc:zsretail}/configs/local/happyness_ho.properties"
# Its keys win over the files inside the WAR.

# The type: store | headoffice (what a head office is: src/main/resources/application-headoffice.properties)
spring.profiles.active=headoffice

# ---------------------------------------------------------------------------------------------------------------------
# Where it runs
# ---------------------------------------------------------------------------------------------------------------------
spring.datasource.url=jdbc:sqlserver://localhost;databaseName=happyness_franchise
spring.datasource.username=sa
spring.datasource.password=admin@123.0
server.port=888
logging.file.name=C:/zsretail-headoffice/logs/backend.log
app.upload.dir=uploads/headoffice/pos-images
# Selling prices from the ERP's price groups (sales_price table): true | false
pos.pricing.enable-sales-price-group=false
headoffice.stock.enabled=false
ownership.catalogue=ERP

