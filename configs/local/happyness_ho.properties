# LOCAL (dev PC) - Head office. NOT a profile: the head office's own file (the "outside file").
# Loaded by the Eclipse debug configuration "Head office" through its VM argument:
#   -Dzsretail.machine-file="${project_loc:zsretail}/configs/local/happyness_ho.properties"
# Its keys win over the files inside the WAR.

# The type: store | headoffice (what a head office is: src/main/resources/application-headoffice.properties)
spring.profiles.active=headoffice

# ---------------------------------------------------------------------------------------------------------------------
# Where it runs
# ---------------------------------------------------------------------------------------------------------------------
spring.datasource.url=jdbc:sqlserver://localhost;databaseName=happyness_franchise
spring.datasource.username=sa
spring.datasource.password=admin@123.0
server.port=888
logging.file.name=C:/zsretail-headoffice/logs/backend.log
app.upload.dir=uploads/headoffice/pos-images
# Selling prices from the ERP's price groups (sales_price table): true | false
pos.pricing.enable-sales-price-group=false
headoffice.stock.enabled=false
ownership.catalogue=ERP
# Invoices from the ERP: the stores' supply documents are the ERP's invoices (FactureFranchise), not the head office's
# BLs and invoices (HEAD_OFFICE | ERP; ERP needs the catalogue only from the ERP and erp.navpospages.enabled=true)
headoffice.supply.source=ERP

# NAV connection (a head office with an ERP)
#erp.dynamicsnav.base-url=http://CHANGE_ME:7048/CHANGE_ME/ODataV4
#erp.dynamicsnav.company=CHANGE_ME
#erp.dynamicsnav.domain=CHANGE_ME
#erp.dynamicsnav.username=CHANGE_ME
#erp.dynamicsnav.password=CHANGE_ME
#erp.sync.enabled=true
#erp.sync.scheduler.delay=60000

# ERP connector "POS pages" (erp/navpospages, ERP catalogue step 5): the catalogue read from the NAV / Business Central
# pages ItemCategory, PointStockPOS, ItemBarCodePOS. GET only, it never writes to the ERP. No ERP job is switched on
# here (erp.sync.enabled is not set): the import comes at step 6.
erp.navpospages.enabled=true
erp.sync.enabled=true
erp.navpospages.base-url=http://192.168.1.124:7048/BC140/ODataV4
erp.navpospages.company=HAPPYNESS
erp.navpospages.domain=HappyNess
erp.navpospages.username=Administrateur
erp.navpospages.password=CHANGE_ME
erp.navpospages.location-code=FRANCHISE
erp.navpospages.default-vat=19
erp.navpospages.price-includes-vat=true
# Invoices from the ERP: the 2021 test data of this BC (no Sell_to_Customer_No on the page yet: the customer's name;
# a store's ERP customer number is then that name). Production: the current and previous year, Sell_to_Customer_No.
erp.navpospages.invoices.years=2021
erp.navpospages.invoices.customer-field=Sell_to_Customer_Name
