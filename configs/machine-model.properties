# Outside file of one ZS Retail installation (configuration step C1): the model. Optional: without one, the installation
# runs on the type file of its application as it is (application-store.properties in the store WAR,
# application-headoffice.properties in the head office WAR). A real installation usually has one, holding only the "where it runs" block.
# Copy it, fill every CHANGE_ME, uncomment what the installation needs, and put the copy where the installation finds it:
#   - Tomcat: ${catalina.base}/conf/zsretail/<context name>.properties
#     (each WAR is deployed alone in its Tomcat as zsretailws: conf/zsretail/zsretailws.properties).
#   - Anywhere else, named by the system property -Dzsretail.machine-file=<path> (Tomcat: in CATALINA_OPTS or the
#     service's Java options; the dev scripts and the IDE use it too). A file named this way that does not exist stops
#     the startup.
# A key here wins over the type file and over application.properties. Never commit a customer's real file outside
# configs/customers. See docs/deployment-modes.md.

# ---------------------------------------------------------------------------------------------------------------------
# What this installation is (only when it differs from the type file)
# ---------------------------------------------------------------------------------------------------------------------
# No type line: the application is the type (the store WAR or the head office WAR). A line that names the type stops
# the startup (code cleanup step 8).
# The owners and the sales, as in the type file (a store on NAV, a store of a network: see application-store.properties)
#ownership.catalogue=LOCAL
#ownership.customers=LOCAL
#ownership.promotions=LOCAL
#ownership.loyalty=LOCAL
#ownership.supply=LOCAL
#sales.upstream=
# The ERP connector: none (the default, also with no line) | emtop (EMTOP's Dynamics NAV) | happyness (Happyness's POS
# pages, a head office whose catalogue only comes from the ERP). The only line that chooses it.
#erp.connector=none
# RFID, a store only: true when it reads RFID tags (its readers and POS machines on the RFID pages); true on a head
# office stops the startup. The POS machines need fixed addresses (docs/modules/rfid.md).
#rfid.enabled=false
# A store with table service (restaurant, coffee shop; 3.2.0, no longer General setup): the tables screen and its count
#pos.table-management.enabled=false
#pos.table-management.table-count=10
# The communication module (3.3.0, a store or a head office; docs/modules/communication.md): true to turn it on; absent,
# empty or false: off
#communication.enabled=false
# With it on, the seconds between two cycles of the module (absent or empty: 60)
#communication.cycle-seconds=60
# Its channels, true / false (absent or empty: false), each with its provider: smtp (email), http (SMS), meta
# (WhatsApp) or test (sends nothing, every message recorded as sent: a WARN at the start and a notice on the page). No
# default since step 8e: a channel on with no provider line, or an unknown name, stays off with a WARN. Then the country
# code put before a member's 8 digits (absent or empty: 216)
#communication.sms.enabled=false
#communication.sms.provider=
#communication.whatsapp.enabled=false
#communication.whatsapp.provider=
#communication.email.enabled=false
#communication.email.provider=
#communication.phone-country-code=216
# 3.3.0 step 8a, email through a mail server: communication.email.provider=smtp, then its server (empty with smtp: the
# email channel off, one WARN), port, security none / starttls / ssl, login, timeout of connect / read / write, sender
#communication.email.smtp.host=
#communication.email.smtp.port=587
#communication.email.smtp.security=starttls
#communication.email.smtp.username=
#communication.email.smtp.password=CHANGE_ME
#communication.email.smtp.timeout-seconds=15
#communication.email.from-address=
#communication.email.from-name=
# Test-recipient mode (tests before going live): filled, every message of that kind goes to this address, not to the
# member's (phone: SMS and WhatsApp)
#communication.test-recipient.phone=
#communication.test-recipient.email=

# ---------------------------------------------------------------------------------------------------------------------
# Where it runs
# ---------------------------------------------------------------------------------------------------------------------
# Database (SQL Server). Create the empty database once; Hibernate creates the tables at the first start.
spring.datasource.url=jdbc:sqlserver://localhost;databaseName=CHANGE_ME
spring.datasource.username=sa
spring.datasource.password=CHANGE_ME

# Port (an embedded start only: in Tomcat the connector decides), log file and image folder. Two installations on one
# machine need their own log file and image folder.
server.port=444
logging.file.name=C:/zsretail/backend.log
logging.level.root=INFO
app.upload.dir=C:/zsretail/uploads/pos-images

# Selling prices from the ERP's price groups (sales_price table): true on an ERP store that uses them
pos.pricing.enable-sales-price-group=false

# NAV connection (an owner ERP): Dynamics NAV / Business Central
#erp.emtop.base-url=http://CHANGE_ME:7048/CHANGE_ME/ODataV4
#erp.emtop.company=CHANGE_ME
#erp.emtop.domain=CHANGE_ME
#erp.emtop.username=CHANGE_ME
#erp.emtop.password=CHANGE_ME
# 3.1.0: NAV timeouts in seconds (defaults 30 and 600; the read timeout is the silence allowed, not the length of a read)
#erp.emtop.connect-timeout-seconds=30
#erp.emtop.read-timeout-seconds=600
#erp.sync.enabled=true
#erp.sync.scheduler.delay=10000

# Head office link (a store of a network, or a store whose sales are only copied up with sales.upstream=HEAD_OFFICE):
# the head office address with its context path, and this store's key, shown once on the head office Stores page. The
# store's code is its DEFAULT_LOCATION (General Setup).
#headoffice.url=http://CHANGE_ME:888/zsretail/api
#headoffice.api-key=CHANGE_ME
# Sales copied up from this date (yyyy-MM-dd); empty: the whole history
#headoffice.sales-push.from-date=
# 3.1.0: read timeout of the pull of copies down, in seconds (default 60; the heartbeat and pushes keep 10 s)
#headoffice.copies-down.read-timeout-seconds=60
