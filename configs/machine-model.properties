# Outside file of one ZS Retail installation (configuration step C1): the model. Optional: without one, the installation
# runs on its type file as it is (src/main/resources/application-store.properties, the default, or
# application-headoffice.properties). A real installation usually has one, holding only the "where it runs" block.
# Copy it, fill every CHANGE_ME, uncomment what the installation needs, and put the copy where the installation finds it:
#   - Tomcat: ${catalina.base}/conf/zsretail/<context name>.properties
#     (the WAR zsretailws.war deploys as the context zsretailws: conf/zsretail/zsretailws.properties). A head office and a
#     store on one Tomcat are two WARs with two context names, so two files.
#   - Anywhere else, named by the system property -Dzsretail.machine-file=<path> (Tomcat: in CATALINA_OPTS or the
#     service's Java options; the dev scripts and the IDE use it too). A file named this way that does not exist stops
#     the startup.
# A key here wins over the type file and over application.properties. Never commit a customer's real file outside
# deploy/customers. See docs/deployment-modes.md.

# ---------------------------------------------------------------------------------------------------------------------
# What this installation is (only when it differs from the type file)
# ---------------------------------------------------------------------------------------------------------------------
# The type: store (the default) | headoffice
#spring.profiles.active=store
# The owners and the sales, as in the type file (a store on NAV, a store of a network: see application-store.properties)
#ownership.catalogue=LOCAL
#ownership.customers=LOCAL
#ownership.promotions=LOCAL
#ownership.loyalty=LOCAL
#ownership.supply=LOCAL
#sales.upstream=
#erp.dynamicsnav.enabled=false

# ---------------------------------------------------------------------------------------------------------------------
# Where it runs
# ---------------------------------------------------------------------------------------------------------------------
# Database (SQL Server). Create the empty database once; Hibernate creates the tables at the first start.
spring.datasource.url=jdbc:sqlserver://localhost;databaseName=CHANGE_ME
spring.datasource.username=sa
spring.datasource.password=CHANGE_ME

# Port (an embedded start only: in Tomcat the connector decides), log file and image folder. Two installations on one
# machine need their own log file and image folder.
server.port=444
logging.file.name=C:/zsretail/backend.log
logging.level.root=INFO
app.upload.dir=C:/zsretail/uploads/pos-images

# Selling prices from the ERP's price groups (sales_price table): true on an ERP store that uses them
pos.pricing.enable-sales-price-group=false

# NAV connection (an owner ERP): Dynamics NAV / Business Central
#erp.dynamicsnav.base-url=http://CHANGE_ME:7048/CHANGE_ME/ODataV4
#erp.dynamicsnav.company=CHANGE_ME
#erp.dynamicsnav.domain=CHANGE_ME
#erp.dynamicsnav.username=CHANGE_ME
#erp.dynamicsnav.password=CHANGE_ME
#erp.sync.enabled=true
#erp.sync.scheduler.delay=10000

# Head office link (a store of a network, or a store whose sales are only copied up with sales.upstream=HEAD_OFFICE):
# the head office address with its context path, and this store's key, shown once on the head office Stores page. The
# store's code is its DEFAULT_LOCATION (General Setup).
#headoffice.url=http://CHANGE_ME:888/zsretail/api
#headoffice.api-key=CHANGE_ME
# Sales copied up from this date (yyyy-MM-dd); empty: the whole history
#headoffice.sales-push.from-date=
