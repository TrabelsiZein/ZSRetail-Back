# Machine file: Happyness franchise, head office, local test from scratch (2026-10-04).
# Loaded with -Dzsretail.machine-file=<this file> (Eclipse launch "happyness-1-headoffice"). See docs/deployment-modes.md.

# What this installation is: the type file of the head office application, as it is

# Database: the empty database created by hand; Hibernate creates the tables at the first start
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.url=jdbc:sqlserver://localhost;databaseName=happyness_franchise;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=admin@123.0
spring.jpa.hibernate.ddl-auto=validate

# Port (889: the head office screen http://localhost:8091 already talks to it), own log file and image folder
server.port=889
logging.file.name=C:/zsretail-happyness/logs/backend.log
logging.level.root=INFO
app.upload.dir=C:/zsretail-happyness/uploads/pos-images

pos.pricing.enable-sales-price-group=false
erp.sync.enabled=false
