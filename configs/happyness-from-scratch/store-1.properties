# Happyness test from scratch: store 1 (code HS01). Outside file, loaded by the Eclipse launch "happyness-store-1"
# (-Dzsretail.machine-file=<this file>). Its lines win over src/main/resources/application-store.properties.

# --- What this installation is: a store of a network, without ERP ---
spring.profiles.active=store
node.type=STORE
# Items, selling prices and goods (BLs) come from the head office
ownership.catalogue=HEAD_OFFICE
ownership.supply=HEAD_OFFICE
# Promotions and loyalty are managed by the head office
ownership.promotions=HEAD_OFFICE
ownership.loyalty=HEAD_OFFICE
# Customers stay the store's
ownership.customers=LOCAL
# The sales are copied up to the head office
sales.upstream=HEAD_OFFICE
erp.dynamicsnav.enabled=false
erp.sync.enabled=false

# --- Where it runs ---
spring.datasource.url=jdbc:sqlserver://localhost;databaseName=happyness_store1
spring.datasource.username=sa
spring.datasource.password=admin@123.0
server.port=557
logging.file.name=C:/zsretail-happyness/store-1/logs/backend.log
app.upload.dir=C:/zsretail-happyness/store-1/uploads/pos-images
pos.pricing.enable-sales-price-group=false

# --- Head office link: the head office address, and this store's key (shown once on the head office Stores page) ---
headoffice.url=http://localhost:888/zsretail/api
headoffice.api-key=PASTE_KEY_OF_HS01
