# Head office (dev): node.type=HEAD_OFFICE, its own database, no till.
# Runs beside a store instance on this PC: backend 888 here, store on 444. See docs/modules/head-office.md
server.port=888

# Database: create the empty pos_headoffice database by hand once; Hibernate creates the tables
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServer2012Dialect
spring.datasource.url=jdbc:sqlserver://localhost;databaseName=pos_headoffice
spring.datasource.username=sa
spring.datasource.password=admin@123.0
spring.jpa.hibernate.ddl-auto=update

# Installation type
node.type=HEAD_OFFICE

# No ERP. Not a franchise profile: franchise.admin/customer=true are refused with node.type=HEAD_OFFICE
application.standalone=true
erp.dynamicsnav.enabled=false
erp.sync.enabled=false
franchise.admin=false
franchise.customer=false
pos.pricing.enable-sales-price-group=true

# Own log file and image folder, so the two instances on this PC do not share them
logging.file.name=C:/zsretail-headoffice/backend.log
app.upload.dir=uploads/headoffice/pos-images

logging.level.root=INFO
