spring.profiles.active=dynamics-dev
server.port=444
server.servlet.context-path=/zsretail/api
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Directory where POS images are stored on disk.
# Path is relative to the working directory of the running server.
# Change to an absolute path in production (e.g. /opt/pos/uploads/pos-images).
app.upload.dir=uploads/pos-images

# Application version — injected from pom.xml at build time via Maven resource filtering
app.version=@project.version@




# Rolling file log: one file per day (gzipped archives), 200MB size splits (in practice: one file per day),
# auto-deleted after 90 days. Console output continues in parallel (procrun).
logging.file.name=C:/zsretail/backend.log
logging.file.max-size=200MB
logging.file.max-history=90
logging.file.total-size-cap=3GB
logging.file.clean-history-on-start=true