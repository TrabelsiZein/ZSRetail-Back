# Common to every installation (configuration step C1). Two types, each with its file: application-store.properties and
# application-headoffice.properties; the store is the default, so POSMainApp starts as is from the IDE. An installation
# may add a file outside the WAR (-Dzsretail.machine-file=<path>, or ${catalina.base}/conf/zsretail/<context
# name>.properties in Tomcat): its keys win over the type file and over this file. See docs/deployment-modes.md.
spring.profiles.active=store

server.servlet.context-path=/zsretail/api
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Database: SQL Server on every installation (the type file or the outside file gives the address and the login)
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServer2012Dialect
spring.jpa.hibernate.ddl-auto=update

# Application version — injected from pom.xml at build time via Maven resource filtering
app.version=@project.version@

# Rolling file log: one file per day (gzipped archives), 200MB size splits (in practice: one file per day),
# auto-deleted after 90 days. Console output continues in parallel (procrun). The file itself: logging.file.name in
# the type file or the outside file.
logging.file.max-size=200MB
logging.file.max-history=90
logging.file.total-size-cap=3GB
logging.file.clean-history-on-start=true
