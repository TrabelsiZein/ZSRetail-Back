# Preset network-store-erp (head office plan, task 9.3): a store on an ERP linked to a head office (ParaFendri): items, customers and stock the ERP's, promotions and loyalty the head office's, sales to the ERP and copied up. The machine file gives headoffice.url and headoffice.api-key.
# Mode keys only, every owner stated. Everything about the machine (database, port, log, uploads, NAV settings, head
# office address and key, sales-push start date) is in the installation's machine file, which names this preset with
# spring.profiles.active=network-store-erp (docs/deployment-modes.md). A key set in the machine file wins over the preset.

node.type=STORE
ownership.catalogue=ERP
ownership.customers=ERP
ownership.promotions=HEAD_OFFICE
ownership.loyalty=HEAD_OFFICE
ownership.supply=ERP
sales.upstream=ERP,HEAD_OFFICE
erp.dynamicsnav.enabled=true
