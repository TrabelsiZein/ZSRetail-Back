# Preset: head office of a network without an ERP (head office plan, step 8). For a new
# franchise network; also the head office of own stores. It never sells: no till, no session, no ticket.
# Copy this file per install and replace every CHANGE_ME. Procedure: docs/modules/franchise.md,
# "Installing a franchise network on the model". Settings: docs/deployment-modes.md, "Presets".
server.port=888

# Database: an empty database created by hand once; Hibernate creates the tables
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServer2012Dialect
spring.datasource.url=jdbc:sqlserver://localhost;databaseName=pos_headoffice
spring.datasource.username=sa
spring.datasource.password=CHANGE_ME
spring.jpa.hibernate.ddl-auto=update

# Installation type
node.type=HEAD_OFFICE

# No ERP
application.standalone=true
erp.dynamicsnav.enabled=false
erp.sync.enabled=false
pos.pricing.enable-sales-price-group=false

# Own log file and image folder, so a store installed on the same server does not share them
logging.file.name=C:/zsretail-headoffice/backend.log
app.upload.dir=C:/zsretail-headoffice/uploads/pos-images
logging.level.root=INFO
