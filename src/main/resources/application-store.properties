# Type store (configuration step C1): an installation that sells. A key of
# the outside file, when there is one, wins over this file (docs/deployment-modes.md).

# ---------------------------------------------------------------------------------------------------------------------
# What this installation is
# ---------------------------------------------------------------------------------------------------------------------
# STORE | HEAD_OFFICE (here always STORE)
node.type=STORE
# Owner of the items, families, barcodes and selling prices: LOCAL | ERP | HEAD_OFFICE
ownership.catalogue=LOCAL
# Owner of the customers: LOCAL | ERP
ownership.customers=LOCAL
# Owner of the promotions: LOCAL | HEAD_OFFICE
ownership.promotions=LOCAL
# Owner of the loyalty program and members: LOCAL | HEAD_OFFICE
ownership.loyalty=LOCAL
# Owner of the stock and the goods received: LOCAL | ERP | HEAD_OFFICE
ownership.supply=LOCAL
# Where the sales go: empty (nowhere) | ERP | HEAD_OFFICE | ERP,HEAD_OFFICE
sales.upstream=
# Dynamics NAV / Business Central connector: true | false (true when an owner is ERP)
erp.dynamicsnav.enabled=false
#
# The two usual variants (the lines go in the outside file; the ERP owns the catalogue, the customers and the supply
# together):
#   A store on NAV:
#     ownership.catalogue=ERP  ownership.customers=ERP  ownership.supply=ERP  sales.upstream=ERP
#     erp.dynamicsnav.enabled=true  and the NAV connection
#   A store of a network (catalogue, selling prices and goods from its head office, sales copied up):
#     ownership.catalogue=HEAD_OFFICE  ownership.supply=HEAD_OFFICE  sales.upstream=HEAD_OFFICE  and the head office
#     link below (a store on NAV in a network keeps the NAV lines, with sales.upstream=ERP,HEAD_OFFICE and its
#     promotions and loyalty HEAD_OFFICE)

# ---------------------------------------------------------------------------------------------------------------------
# Where it runs: NOT in this file
# ---------------------------------------------------------------------------------------------------------------------
# The database, the port, the log file, the upload folder, the price group switch, the NAV connection and the head office link are in
# the installation's own file, outside the WAR. Its keys win over this file. Without it the application has no
# database and does not start. Examples and the rule: configs/README.txt
#   Eclipse: the VM argument -Dzsretail.machine-file=<path of the file> in the debug configuration
#   Tomcat:  <Tomcat>/conf/zsretail/zsretailws.properties
