# Preset headoffice (head office plan, task 9.3): a head office without an ERP. It never sells; it decides the catalogue, prices, promotions and loyalty of its stores and supplies them.
# Mode keys only, every owner stated. Everything about the machine (database, port, log, uploads, NAV settings, head
# office address and key, sales-push start date) is in the installation's machine file, which names this preset with
# spring.profiles.active=headoffice (docs/deployment-modes.md). A key set in the machine file wins over the preset.

node.type=HEAD_OFFICE
ownership.catalogue=LOCAL
ownership.customers=LOCAL
ownership.promotions=LOCAL
ownership.loyalty=LOCAL
ownership.supply=LOCAL
sales.upstream=
erp.dynamicsnav.enabled=false
