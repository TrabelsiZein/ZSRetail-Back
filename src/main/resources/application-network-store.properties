# Preset: store of a network without an ERP (head office plan, step 8). Replaces franchise-customer for a new
# franchise network. Items, selling prices and goods come from the head office; promotions, loyalty and customers are
# the store's; its sales are copied to the head office. Whether the store pays for its goods, its billing details and
# its two rights are set on its row on the head office Stores page, not here.
# Copy this file per store and replace every CHANGE_ME. Procedure: docs/modules/franchise.md,
# "Installing a franchise network on the model". Settings: docs/deployment-modes.md, "Presets".

# Database: an empty database created by hand once; Hibernate creates the tables
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServer2012Dialect
spring.datasource.url=jdbc:sqlserver://localhost;databaseName=pos_store
spring.datasource.username=sa
spring.datasource.password=CHANGE_ME
spring.jpa.hibernate.ddl-auto=update

# No ERP, not a franchise profile
application.standalone=true
erp.dynamicsnav.enabled=false
erp.sync.enabled=false
franchise.admin=false
franchise.customer=false
pos.pricing.enable-sales-price-group=false

# Head office link: the head office URL (with the context path) and the store's key, shown once on the head office
# Stores page when the store row is created
headoffice.url=http://CHANGE_ME:888/zsretail/api
headoffice.api-key=CHANGE_ME
sales.upstream=HEAD_OFFICE

# What the head office decides for this store
ownership.catalogue=HEAD_OFFICE
ownership.supply=HEAD_OFFICE
ownership.promotions=LOCAL
ownership.loyalty=LOCAL

logging.level.root=INFO
