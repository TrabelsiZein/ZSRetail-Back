# Preset network-store (head office plan, task 9.3): a store fed by its head office (own store or franchise store): catalogue, selling prices and goods from the head office, promotions, loyalty and customers its own, sales copied up. The machine file gives headoffice.url and headoffice.api-key.
# Mode keys only, every owner stated. Everything about the machine (database, port, log, uploads, NAV settings, head
# office address and key, sales-push start date) is in the installation's machine file, which names this preset with
# spring.profiles.active=network-store (docs/deployment-modes.md). A key set in the machine file wins over the preset.

node.type=STORE
ownership.catalogue=HEAD_OFFICE
ownership.customers=LOCAL
ownership.promotions=LOCAL
ownership.loyalty=LOCAL
ownership.supply=HEAD_OFFICE
sales.upstream=HEAD_OFFICE
erp.dynamicsnav.enabled=false
