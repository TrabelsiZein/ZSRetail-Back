# TEST FILE (Happyness test from scratch): store 1, code HS01. Not a profile: it is this store's own file, loaded by the
# Eclipse run "happyness-store-1" (-Dzsretail.machine-file). Remove before building a WAR for a customer.
# Type store (configuration step C1): an installation that sells. The default type (application.properties). A key of
# the outside file, when there is one, wins over this file (docs/deployment-modes.md).

# ---------------------------------------------------------------------------------------------------------------------
# What this installation is
# ---------------------------------------------------------------------------------------------------------------------
# STORE | HEAD_OFFICE (here always STORE)
spring.profiles.active=store
node.type=STORE
# Owner of the items, families, barcodes and selling prices: LOCAL | ERP | HEAD_OFFICE
ownership.catalogue=HEAD_OFFICE
# Owner of the customers: LOCAL | ERP
ownership.customers=LOCAL
# Owner of the promotions: LOCAL | HEAD_OFFICE
ownership.promotions=HEAD_OFFICE
# Owner of the loyalty program and members: LOCAL | HEAD_OFFICE
ownership.loyalty=HEAD_OFFICE
# Owner of the stock and the goods received: LOCAL | ERP | HEAD_OFFICE
ownership.supply=HEAD_OFFICE
# Where the sales go: empty (nowhere) | ERP | HEAD_OFFICE | ERP,HEAD_OFFICE
sales.upstream=HEAD_OFFICE
# Dynamics NAV / Business Central connector: true | false (true when an owner is ERP)
erp.dynamicsnav.enabled=false
#
# The two usual variants (the lines go in the outside file; the ERP owns the catalogue, the customers and the supply
# together):
#   A store on NAV:
#     ownership.catalogue=ERP  ownership.customers=ERP  ownership.supply=ERP  sales.upstream=ERP
#     erp.dynamicsnav.enabled=true  and the NAV connection below
#   A store of a network (catalogue, selling prices and goods from its head office, sales copied up):
#     ownership.catalogue=HEAD_OFFICE  ownership.supply=HEAD_OFFICE  sales.upstream=HEAD_OFFICE  and the head office
#     link below (a store on NAV in a network keeps the NAV lines, with sales.upstream=ERP,HEAD_OFFICE and its
#     promotions and loyalty HEAD_OFFICE)

# ---------------------------------------------------------------------------------------------------------------------
# Where it runs (dev values: store A, pos_db_prod)
# ---------------------------------------------------------------------------------------------------------------------
spring.datasource.url=jdbc:sqlserver://localhost;databaseName=happyness_store1
spring.datasource.username=sa
# Not kept in the WAR: the environment variable ZSRETAIL_DB_PASSWORD (IDE launch), or this key in the outside file
spring.datasource.password=admin@123.0
server.port=991
logging.file.name=C:/zsretail/logs/store1/backend.log
app.upload.dir=uploads/store1/pos-images
# Selling prices from the ERP's price groups (sales_price table): true | false
pos.pricing.enable-sales-price-group=false

# NAV connection (a store on NAV)
#erp.dynamicsnav.base-url=http://CHANGE_ME:7048/CHANGE_ME/ODataV4
#erp.dynamicsnav.company=CHANGE_ME
#erp.dynamicsnav.domain=CHANGE_ME
#erp.dynamicsnav.username=CHANGE_ME
#erp.dynamicsnav.password=CHANGE_ME
