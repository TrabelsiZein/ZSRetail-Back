# Preset store-erp (head office plan, task 9.3): a store on an ERP (Dynamics NAV / Business Central): items, customers and stock are the ERP's.
# Mode keys only, every owner stated. Everything about the machine (database, port, log, uploads, NAV settings, head
# office address and key, sales-push start date) is in the installation's machine file, which names this preset with
# spring.profiles.active=store-erp (docs/deployment-modes.md). A key set in the machine file wins over the preset.

node.type=STORE
ownership.catalogue=ERP
ownership.customers=ERP
ownership.promotions=LOCAL
ownership.loyalty=LOCAL
ownership.supply=ERP
sales.upstream=ERP
erp.dynamicsnav.enabled=true
