# NAV: the TEST instance only (the erp.dynamicsnav.* values of application-dynamics-test.properties).
# Never put here the NAV address of application-dynamics-dev.properties or application-dynamics-prod.properties:
# that is the customer's production NAV.
#
# Head office with an ERP (dev, task 3.4): node.type=HEAD_OFFICE, items, families, sub-families, barcodes and locations
# imported from Business Central / NAV with the existing import jobs, filtered on the ERP reference location chosen at
# the head office. It exports nothing (export jobs switched off at each start). Same database and port as
# headoffice-dev, which stays the head office without ERP. See docs/modules/head-office.md, "Head office with an ERP".
server.port=888

# Database: the same pos_headoffice as headoffice-dev
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServer2012Dialect
spring.datasource.url=jdbc:sqlserver://localhost;databaseName=pos_headoffice
spring.datasource.username=sa
spring.datasource.password=admin@123.0
spring.jpa.hibernate.ddl-auto=update

# Installation type
node.type=HEAD_OFFICE

# ERP mode: catalogue, customers and supply owned by the ERP (derived); promotions and loyalty local to the head office.
# franchise.admin/customer=true are refused at startup (franchise profiles removed, step 9)
application.standalone=false
pos.pricing.enable-sales-price-group=true

# NAV connection: the TEST instance, the settings of application-dynamics-test.properties (never dev or prod)
erp.dynamicsnav.enabled=true
erp.dynamicsnav.base-url=http://192.168.10.166:24/test4/ODataV4
erp.dynamicsnav.company=005-SCPC
erp.dynamicsnav.domain=Groupe-Hammami
erp.dynamicsnav.username=POS
erp.dynamicsnav.password=SCPC**2026**

# ERP job scheduler on: only the import jobs enabled from the ERP jobs page run (all seeded disabled); the export jobs
# and the price import never run on a head office
erp.sync.enabled=true
erp.sync.scheduler.delay=60000

# Own log file and image folder, as headoffice-dev
logging.file.name=C:/zsretail-headoffice/backend.log
app.upload.dir=uploads/headoffice/pos-images

logging.level.root=INFO
