# Store B of the head office pair on this PC (L2 of the head office plan, steps 4 and 5).
# Started by devenv/start.ps1 (never in STS): port 555, its own database pos_store_b, linked to the head office
# (headoffice-dev, port 888). DEFAULT_LOCATION is STORE-B (general setup, set by devenv/setup-stores.ps1).
server.port=555

spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServer2012Dialect
spring.datasource.url=jdbc:sqlserver://localhost;databaseName=pos_store_b
spring.datasource.username=sa
spring.datasource.password=admin@123.0
spring.jpa.hibernate.ddl-auto=update

application.standalone=true
erp.dynamicsnav.enabled=false
erp.sync.enabled=false
franchise.admin=false
franchise.customer=false
pos.pricing.enable-sales-price-group=true

# Own log file and image folder
logging.file.name=C:/zsretail-store-b/backend.log
app.upload.dir=uploads/store-b/pos-images
logging.level.root=INFO

# Head office link: key shown once on the head office Stores page for STORE-B
headoffice.url=http://localhost:888/zsretail/api
headoffice.api-key=XMiR3sp0i6dRV3-FgKgJ18df3DflFxHlEHPPrL5d_RM
sales.upstream=HEAD_OFFICE
ownership.loyalty=HEAD_OFFICE
