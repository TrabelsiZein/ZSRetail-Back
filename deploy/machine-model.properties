# Machine file of one ZS Retail installation (head office plan, task 9.3): the model. Copy it, fill every CHANGE_ME,
# uncomment what the installation needs, and put the copy where the installation finds it:
#   - Tomcat: ${catalina.base}/conf/zsretail/<context name>.properties
#     (the WAR zsretailws.war deploys as the context zsretailws: conf/zsretail/zsretailws.properties). A head office and a
#     store on one Tomcat are two WARs with two context names, so two files.
#   - Anywhere else, named by the system property -Dzsretail.machine-file=<path> (Tomcat: in CATALINA_OPTS or the
#     service's Java options; the dev scripts and the IDE use it too).
# Without a machine file the application does not start and says what is missing. A key here wins over the preset and
# over application.properties. Never commit a customer's real file outside deploy/customers. See docs/deployment-modes.md.

# What the installation is: one preset (src/main/resources/application-<preset>.properties)
#   store             a store without an ERP (one shop alone)
#   store-erp         a store on Dynamics NAV / Business Central
#   headoffice        a head office without an ERP (never sells)
#   headoffice-erp    a head office with an ERP (imports only)
#   network-store     a store fed by its head office (own store or franchise store)
#   network-store-erp a store on an ERP linked to a head office (promotions and loyalty from the head office)
spring.profiles.active=CHANGE_ME

# Database (SQL Server). Create the empty database once; Hibernate creates the tables at the first start.
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServer2012Dialect
spring.datasource.url=jdbc:sqlserver://localhost;databaseName=CHANGE_ME
spring.datasource.username=sa
spring.datasource.password=CHANGE_ME
spring.jpa.hibernate.ddl-auto=update

# Port (an embedded start only: in Tomcat the connector decides), log file and image folder. Two installations on one
# machine need their own log file and image folder.
server.port=444
logging.file.name=C:/zsretail/backend.log
logging.level.root=INFO
app.upload.dir=C:/zsretail/uploads/pos-images

# Selling prices from the ERP's price groups (sales_price table): true on an ERP store that uses them
pos.pricing.enable-sales-price-group=false

# ERP (presets store-erp, headoffice-erp, network-store-erp): Dynamics NAV / Business Central
#erp.dynamicsnav.base-url=http://CHANGE_ME:7048/CHANGE_ME/ODataV4
#erp.dynamicsnav.company=CHANGE_ME
#erp.dynamicsnav.domain=CHANGE_ME
#erp.dynamicsnav.username=CHANGE_ME
#erp.dynamicsnav.password=CHANGE_ME
#erp.sync.enabled=true
#erp.sync.scheduler.delay=10000

# Head office link (presets network-store and network-store-erp; also a store whose sales are only copied up, with
# sales.upstream=HEAD_OFFICE): the head office address with its context path, and this store's key, shown once on the
# head office Stores page. The store's code is its DEFAULT_LOCATION (General Setup).
#headoffice.url=http://CHANGE_ME:888/zsretail/api
#headoffice.api-key=CHANGE_ME
# Sales copied up from this date (yyyy-MM-dd); empty: the whole history
#headoffice.sales-push.from-date=

# A store's own answer may differ from its preset: an ownership.* or sales.upstream key here wins over the preset
# (the dev stores B and C take their loyalty from the head office this way).
