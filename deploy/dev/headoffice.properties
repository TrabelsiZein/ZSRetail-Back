# Machine file (head office plan, task 9.3). Was src/main/resources/application-headoffice-dev.properties, moved as it was:
# every value kept; the mode keys the preset gives are commented out, a mode key that differs stays as an override.
# Loaded with -Dzsretail.machine-file=<this file> (dev scripts, IDE) or as ${catalina.base}/conf/zsretail/<context>.properties
# in Tomcat. See docs/deployment-modes.md.
# Dev head office (devenv instance headoffice, port 888, pos_headoffice).
spring.profiles.active=headoffice

# Head office (dev): node.type=HEAD_OFFICE, its own database, no till.
# Runs beside a store instance on this PC: backend 888 here, store on 444. See docs/modules/head-office.md
server.port=888

# Database: create the empty pos_headoffice database by hand once; Hibernate creates the tables
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServer2012Dialect
spring.datasource.url=jdbc:sqlserver://localhost;databaseName=pos_headoffice
spring.datasource.username=sa
spring.datasource.password=admin@123.0
spring.jpa.hibernate.ddl-auto=update

# Installation type
# node.type=HEAD_OFFICE   (given by the preset headoffice)

# No ERP
# application.standalone=true   (removed at task 9.3: the preset headoffice says it)
# erp.dynamicsnav.enabled=false   (given by the preset headoffice)
erp.sync.enabled=false
pos.pricing.enable-sales-price-group=true

# Own log file and image folder, so the two instances on this PC do not share them
logging.file.name=C:/zsretail-headoffice/backend.log
app.upload.dir=uploads/headoffice/pos-images

logging.level.root=INFO
