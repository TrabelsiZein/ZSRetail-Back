# Outside file (head office plan, task 9.3). Was src/main/resources/application-store-c-dev.properties, moved as it was:
# every value kept. Configuration step C1: it names its type (store or headoffice) and states the mode lines that differ.
# Loaded with -Dzsretail.machine-file=<this file> (dev scripts, IDE) or as ${catalina.base}/conf/zsretail/<context>.properties
# in Tomcat. See docs/deployment-modes.md.
# Dev store C (devenv instance store-c, port 556, pos_store_c).
# What this installation is (configuration step C1): the type, and the mode lines the preset network-store gave
spring.profiles.active=store
node.type=STORE
# Step 6: items, families, sub-families, barcodes and selling prices decided by the head office (L2 of step 6)
ownership.catalogue=HEAD_OFFICE
ownership.customers=LOCAL
ownership.promotions=LOCAL
# The loyalty of the head office (L2 of steps 4 and 5; the preset network-store gave LOCAL)
ownership.loyalty=HEAD_OFFICE
# Store C keeps its supply local (the preset network-store gave HEAD_OFFICE; the L2 of steps 7A and 7B need one store
# that is not supplied)
ownership.supply=LOCAL
sales.upstream=HEAD_OFFICE
erp.dynamicsnav.enabled=false

# Store C of the head office pair on this PC (L2 of the head office plan, steps 4 and 5).
# Started by devenv/start.ps1 (never in STS): port 556, its own database pos_store_c, linked to the head office
# (headoffice-dev, port 888). DEFAULT_LOCATION is STORE-C (general setup, set by devenv/setup-stores.ps1).
server.port=556

spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServer2012Dialect
spring.datasource.url=jdbc:sqlserver://localhost;databaseName=pos_store_c
spring.datasource.username=sa
spring.datasource.password=admin@123.0
spring.jpa.hibernate.ddl-auto=update

# application.standalone=true   (removed at task 9.3: the mode lines above say it)
erp.sync.enabled=false
pos.pricing.enable-sales-price-group=true

# Own log file and image folder
logging.file.name=C:/zsretail-store-c/backend.log
app.upload.dir=uploads/store-c/pos-images
logging.level.root=INFO

# Head office link: key shown once on the head office Stores page for STORE-C
headoffice.url=http://localhost:888/zsretail/api
headoffice.api-key=ueV5GQ262PmpG2nk5KzLJpbcPr0jPZhEhkqzcb_W2hM
