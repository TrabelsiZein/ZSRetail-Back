# Machine file (head office plan, task 9.3). Was src/main/resources/application-standalone-dev.properties, moved as it was:
# every value kept; the mode keys the preset gives are commented out, a mode key that differs stays as an override.
# Loaded with -Dzsretail.machine-file=<this file> (dev scripts, IDE) or as ${catalina.base}/conf/zsretail/<context>.properties
# in Tomcat. See docs/deployment-modes.md.
# Dev store A (pos_db_prod): linked to the dev head office for its sales copies. Never started by the devenv scripts.
spring.profiles.active=store

# Standalone profile: POS runs without ERP (no Dynamics NAV / Business Central).
# Activate with: spring.profiles.active=standalone (or include 'standalone' in active profiles).
# Combine with dev/production as needed, e.g. standalone,dev or standalone,production.
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServer2012Dialect
spring.datasource.url=jdbc:sqlserver://localhost;databaseName=pos_db_prod
spring.datasource.username=sa
spring.datasource.password=admin@123.0
spring.jpa.hibernate.ddl-auto=update

# application.standalone=true   (removed at task 9.3: the preset store says it)

# erp.dynamicsnav.enabled=false   (given by the preset store)
erp.sync.enabled=false
pos.pricing.enable-sales-price-group=true

logging.level.root=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
spring.jpa.properties.hibernate.format_sql=true

# Head office link: uncomment both lines and paste the key shown once on the head office Stores page
