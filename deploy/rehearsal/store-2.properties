# Rehearsal environment (head office plan, step 9): store-2. Beside the L2 instances, on its own port, database, log and
# images; started, stopped and reset by devenv/rehearsal.ps1. The database login is the one of the dev machines.
spring.profiles.active=network-store

spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServer2012Dialect
spring.datasource.url=jdbc:sqlserver://localhost;databaseName=pos_rehearsal_s2
spring.datasource.username=sa
spring.datasource.password=admin@123.0
spring.jpa.hibernate.ddl-auto=update

server.port=558
logging.file.name=C:/zsretail-rehearsal/store-2/backend.log
logging.level.root=INFO
app.upload.dir=C:/zsretail-rehearsal/store-2/uploads/pos-images
pos.pricing.enable-sales-price-group=false
erp.sync.enabled=false

# Head office link: the key is written by devenv/rehearsal.ps1 -Action set-key once the store is created on the head office
# Stores page (code STORE-1 / STORE-2, the store's DEFAULT_LOCATION). Until then the head office refuses the store (401).
headoffice.url=http://localhost:889/zsretail/api
headoffice.api-key=NOT-REGISTERED-YET
