# Type headoffice (configuration step C1): an installation that manages stores and never sells, in the head office WAR
# (HeadOfficeApplication). The application is the type: no file names it (code cleanup step 8: a spring.profiles.active
# or node.type line stops the startup). A key of the outside file, when there is one, wins over this file
# (docs/deployment-modes.md).

# ---------------------------------------------------------------------------------------------------------------------
# What this installation is
# ---------------------------------------------------------------------------------------------------------------------
# Owner of the items, families, barcodes and selling prices: LOCAL | ERP (a head office with an ERP imports them).
# ERP with ownership.customers and ownership.supply both ERP: the head office with an ERP. ERP with both of them not
# ERP: accepted on a head office only, its catalogue comes from the ERP and it keeps its customers, supply, price
# lists and BLs. Any other mix stops the startup.
ownership.catalogue=LOCAL
# Owner of the customers: LOCAL | ERP
ownership.customers=LOCAL
# Owner of the promotions: LOCAL
ownership.promotions=LOCAL
# Owner of the loyalty program and members: LOCAL
ownership.loyalty=LOCAL
# Owner of the supply (purchases, stock, the goods sent to the stores): LOCAL | ERP. LOCAL: the head office sends the
# BLs; it keeps its own stock only with headoffice.stock.enabled=true
ownership.supply=LOCAL
# Head office keeps its own stock and makes purchases: true | false (false: no stock, no purchases, a BL moves no stock)
headoffice.stock.enabled=true
# Where the sales go: empty (a head office never sells)
sales.upstream=
# ERP connector: chosen with one line in the outside file (absent: none),
#   erp.connector=none | emtop | happyness
# (emtop: the head office with an ERP; happyness: the catalogue only from the ERP)

# ---------------------------------------------------------------------------------------------------------------------
# Where it runs: NOT in this file
# ---------------------------------------------------------------------------------------------------------------------
# The database, the port, the log file, the upload folder, the price group switch and the NAV connection are in
# the installation's own file, outside the WAR. Its keys win over this file. Without it the application has no
# database and does not start. Examples and the rule: configs/README.txt
#   Eclipse: the VM argument -Dzsretail.machine-file=<path of the file> in the debug configuration
#   Tomcat:  <Tomcat>/conf/zsretail/zsretailws.properties
